<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F1EFEA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Tiny5&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved theme before first paint (kept in sync by src/theme.js)
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') {
          document.documentElement.dataset.theme = 'market-dark';
          document.querySelector('meta[name="theme-color"]').content = '#121110';
        }
      } catch (e) {}
    </script>
    <title>TUM Blockchain Hackathon</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
